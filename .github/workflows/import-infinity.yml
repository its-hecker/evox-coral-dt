name: Import InfinityX coral source for RisingOS
on:
  push:
    paths:
      - .github/workflows/import-infinity.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'its-hecker/risingos-coral-dt'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout RisingOS repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import stable InfinityX coral tree
        shell: bash
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git clone --single-branch --depth 1 --branch cnb-Latest-stable https://github.com/its-hecker/infinity_cnb_android_device_google_coral.git /tmp/infinity-coral
          rsync -a --delete --exclude='/.git/' --exclude='/.github/' /tmp/infinity-coral/ ./
          python3 - <<'PY'
          from pathlib import Path
          products = Path("AndroidProducts.mk")
          s = products.read_text()
          s = s.replace("    $(LOCAL_DIR)/lineage_coral.mk \\\n    $(LOCAL_DIR)/lineage_flame.mk", "    $(LOCAL_DIR)/lineage_coral.mk")
          products.write_text(s)
          product = Path("lineage_coral.mk")
          s = product.read_text()
          for old, new in [
              ("INFINITY_BUILD := coral\n", ""),
              ('INFINITY_MAINTAINER := "Hecker"', "RISING_MAINTAINER := Hecker\nTARGET_ENABLE_BLUR := true"),
              ("WITH_GAPPS := true", "WITH_GMS := true"),
              ("vendor/infinity/config/common_full_phone.mk", "vendor/lineage/config/common_full_phone.mk"),
              ("ro.infinity.soc=", "ro.rising.chipset="),
              ("ro.infinity.camera=", "ro.rising.camera="),
          ]:
              if old not in s:
                  raise SystemExit("Missing expected source setting: " + old)
              s = s.replace(old, new, 1)
          marker = "# Inherit some common Lineage stuff."
          if marker not in s:
              raise SystemExit("Missing product marker")
          s = s.replace(marker,
              'PRODUCT_BUILD_PROP_OVERRIDES += \\\n'
              '    RisingChipset="Qualcomm Snapdragon 855" \\\n'
              '    RisingMaintainer="Hecker"\n\n' + marker, 1)
          product.write_text(s)
          PY
          git config user.name Hecker
          git config user.email 118846180+its-hecker@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "rising: port stable InfinityX coral device tree"
            git push origin HEAD:main
          fi
